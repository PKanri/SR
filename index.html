<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Search Box</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpolygon%20points%3D%224%2C14%2028%2C14%2016%2C5%22%20fill%3D%22%23fff4e6%22%2F%3E%3Cpolygon%20points%3D%224%2C14%2028%2C14%2028%2C27%204%2C27%22%20fill%3D%22%23f3a6b8%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%2219%22%20width%3D%2224%22%20height%3D%221.8%22%20fill%3D%22%23fff4e6%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%2223.5%22%20width%3D%2224%22%20height%3D%221.8%22%20fill%3D%22%23fff4e6%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%2214%22%20width%3D%2224%22%20height%3D%223%22%20fill%3D%22%23d9788f%22%2F%3E%3Cpolygon%20points%3D%224%2C14%2028%2C14%2016%2C5%22%20fill%3D%22none%22%20stroke%3D%22%23e8c9a8%22%20stroke-width%3D%22.8%22%20stroke-linejoin%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%228.6%22%20r%3D%222.4%22%20fill%3D%22%23e5384f%22%2F%3E%3Cpath%20d%3D%22M16%206.4%20q.8%20-2%202.6%20-2.4%22%20fill%3D%22none%22%20stroke%3D%22%234fa84e%22%20stroke-width%3D%221.2%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<style>
/* Layout: sticky header (title, two tabs, search) over a results area. Tab "ค้นหา" = cards/table. Tab "สินค้า" = product codes list. Tab "แก้ไขสาขา" = tappable list that opens a bottom-sheet form. */
:root{
  --bg:#f7f4f4;
  --surface:#ffffff;
  --fg:#2a2226;
  --muted:#6f6469;
  --line:#e6dfe1;
  --accent:#a4254b;
  --accent-soft:#f6e3e9;
  --accent-fg:#ffffff;
  --ok:#1f7a4d;
  --ok-soft:#e1f2e9;
  --off:#7a6f74;
  --off-soft:#ece7e9;
  --warn:#8a5a00;
  --warn-soft:#fdf0d2;
  --danger:#b3261e;
  --danger-soft:#fbe4e2;
  --mark:#ffe58a;
  --scrim:rgba(30,18,24,.45);
  --font-body:"Noto Sans Thai","Sarabun",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171214;--surface:#221b1e;--fg:#f1eaed;--muted:#a79ca1;--line:#372d31;
    --accent:#ee7d9f;--accent-soft:#3a222b;--accent-fg:#2a0f19;
    --ok:#6fd3a0;--ok-soft:#1c3328;--off:#a79ca1;--off-soft:#2e2629;
    --warn:#f0c46a;--warn-soft:#3a2f12;--danger:#ff8f86;--danger-soft:#3d1f1d;
    --mark:#6b5a12;--scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171214;--surface:#221b1e;--fg:#f1eaed;--muted:#a79ca1;--line:#372d31;
  --accent:#ee7d9f;--accent-soft:#3a222b;--accent-fg:#2a0f19;
  --ok:#6fd3a0;--ok-soft:#1c3328;--off:#a79ca1;--off-soft:#2e2629;
  --warn:#f0c46a;--warn-soft:#3a2f12;--danger:#ff8f86;--danger-soft:#3d1f1d;
  --mark:#6b5a12;--scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
.themebtn{margin-left:auto;flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.themebtn:hover{border-color:var(--accent)}
.themebtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.themepanel{position:absolute;right:0;top:calc(100% - 6px);z-index:30;width:min(300px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 10px 30px var(--scrim)}
.themepanel h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.themepanel .seg{margin-bottom:14px;display:flex}
.themepanel .seg button{flex:1}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;position:relative}
.swatch[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface) inset}
.swatch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.swname{margin-top:10px;font-size:13px;color:var(--muted)}
.dpill{display:inline-block;min-width:32px;text-align:center;padding:2px 7px;border-radius:10px;font-size:12px;border:1px solid var(--line);color:var(--muted);line-height:1.5}
.dpill.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.dayrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.daylbl{font-size:13px;color:var(--muted);margin-right:2px}
.dayline{display:flex;gap:4px;flex-wrap:wrap}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
h1{font-size:18px;line-height:1.3;margin:0 0 10px;font-weight:700;text-wrap:balance;display:flex;align-items:center;gap:10px}
.logo{flex:none;width:36px;height:36px}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:2px;margin:0 0 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{min-height:44px;padding:8px 12px;white-space:nowrap;flex:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:transparent;color:var(--muted);font-size:15px;cursor:pointer}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700;border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.search{position:relative}
.search input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font-size:16px;padding:0 46px 0 44px}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:14px;top:15px;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.clear{position:absolute;right:6px;top:7px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
.clear:focus-visible,.chip:focus-visible,.seg button:focus-visible,.copy:focus-visible,.sort:focus-visible,.btn:focus-visible,.erow:focus-visible,.x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.spacer{flex:1}
.sort{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;padding:0 8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{height:34px;padding:0 12px;border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.count{font-size:13px;color:var(--muted);margin:12px 0 10px}
.note{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.note button{margin-left:8px}

.btn{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
.btn.danger.arm{background:var(--danger);color:var(--accent-fg)}
.btn:disabled{opacity:.55;cursor:default}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card-head h2{font-size:16px;line-height:1.35;margin:0;font-weight:700;overflow-wrap:anywhere}
.eng{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.code{flex:none;font-family:var(--font-mono);font-size:13px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:10px;margin-top:8px}
.pill.yes{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--off-soft);color:var(--off)}
dl{margin:10px 0 0;display:grid;grid-template-columns:78px minmax(0,1fr);gap:7px 10px}
dt{font-size:12px;color:var(--muted);padding-top:2px}
dd{margin:0;overflow-wrap:anywhere;min-width:0}
.val{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.val span,.val a{min-width:0}
.tel{color:var(--accent);font-weight:700;text-decoration:none;font-variant-numeric:tabular-nums}
.copy{flex:none;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--muted);font-size:12px;cursor:pointer}
.copy:active{background:var(--accent-soft)}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;min-width:1000px;width:100%;font-size:13.5px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--surface);font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{position:sticky;left:0;background:var(--surface);box-shadow:1px 0 0 var(--line);min-width:150px}
td.mono{font-family:var(--font-mono);font-size:13px;white-space:nowrap}
td.nowrap{white-space:nowrap}

/* edit list */
.editbar{display:flex;align-items:center;gap:10px;margin:12px 0 10px;flex-wrap:wrap}
.barbtns{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.syncbox{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:14px}
.syncbox b{font-size:15px}
.syncbox ul{margin:6px 0 0;padding-left:20px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.syncbox .srow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.syncbox.ok{border-color:var(--ok)}.syncbox.err{border-color:var(--danger)}
.editbar .count{margin:0;flex:1}
.elist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:8px}
.erow{display:flex;align-items:center;gap:10px;width:100%;min-width:0;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.erow:active{background:var(--accent-soft)}
.erow .main{flex:1;min-width:0}
.erow .name{font-weight:700;overflow-wrap:anywhere}
.erow .sub{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.erow .go{flex:none;font-size:13px;color:var(--accent);font-weight:700}

.dbstat{margin:0 0 10px;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* bottom sheet form */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;width:100%;max-width:560px;max-height:94%;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border:1px solid var(--line)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.panel-head h2{margin:0;font-size:17px}
.x{width:40px;height:40px;border:0;background:transparent;font-size:26px;color:var(--muted);cursor:pointer;border-radius:50%}
.field{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.field label{font-size:13px;color:var(--muted)}
.field label i{color:var(--danger);font-style:normal}
.field input[type=text],.field input[type=tel],.field input[type=email],.field input[type=password],.field textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:16px}
.field textarea{resize:vertical;min-height:72px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field input[aria-invalid="true"]{border-color:var(--danger)}
.two{display:grid;grid-template-columns:1fr 130px;gap:10px}
.switch{display:flex;align-items:center;gap:10px;margin-top:14px;min-height:44px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.ferr{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:var(--danger-soft);color:var(--danger);font-size:13px}
.panel-actions{display:flex;gap:8px;align-items:center;margin-top:18px;flex-wrap:wrap}
@media (min-width:720px){.sheet{align-items:center}.panel{border-radius:16px;max-height:90%}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;z-index:40;pointer-events:none;max-width:90%;text-align:center}

html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.linkbtn{border:0;background:transparent;color:var(--accent);font-size:inherit;text-decoration:underline;cursor:pointer;padding:4px 2px}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.loginbox{max-width:420px;margin:24px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px max(16px,env(safe-area-inset-left,0px)) 18px}
.loginbox h2{margin:0 0 4px;font-size:17px}
.loginbox p{margin:0;font-size:13px;color:var(--muted)}
.loginbox .panel-actions{margin-top:16px}
.loginbox .btn{width:100%}

/* products */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:8px}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.pname{font-weight:700;overflow-wrap:anywhere;line-height:1.4}
.pmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.unit{font-size:12px;padding:1px 9px;border-radius:10px;background:var(--off-soft);color:var(--off)}
.dup{font-size:12px;padding:1px 9px;border-radius:10px;background:var(--warn-soft);color:var(--warn)}
.pbottom{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.pcode{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.pcode .code{font-size:14px;padding:3px 9px}
.nocode{font-size:13px;color:var(--muted)}
.price{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.price.none{font-weight:400;font-size:13px;color:var(--muted)}
.per{font-size:12px;padding:1px 9px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.cardfoot{margin-top:12px;display:flex;justify-content:flex-end;gap:8px;align-items:center}
.copyall{height:32px;color:var(--accent);border-color:var(--accent)}
.btn.small{height:32px;padding:0 12px;font-size:13px}

/* nav: two groups (branches | product codes). Mobile = top row with a vertical divider, desktop = left sidebar */
.tabgroup{display:flex;gap:2px;flex:none}
.tabgroup-l{display:none}
.tabsep{flex:none;width:1px;background:var(--line);margin:8px 8px;align-self:stretch}
.tabs{padding-top:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg)}
header.top{top:calc(58px + env(safe-area-inset-top,0px))}
@media (min-width:860px){
  .wrap{max-width:1400px;display:grid;grid-template-columns:210px minmax(0,1fr);column-gap:24px;align-items:start}
  .wrap>*{grid-column:2}
  .wrap>nav.tabs{grid-column:1;grid-row:1 / span 8;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;flex-direction:column;overflow:visible;border:0;margin:0;padding:20px 0 0;gap:0}
  header.top{top:env(safe-area-inset-top,0px)}
  .tabgroup{flex-direction:column;gap:2px}
  .tabgroup-l{display:block;font-size:12px;color:var(--muted);padding:4px 14px 6px;letter-spacing:.02em}
  .tabsep{width:auto;height:1px;margin:14px 0 10px;align-self:auto}
  .tabs button{width:100%;text-align:left;border:0;border-left:3px solid transparent;border-radius:0 8px 8px 0;margin:0;padding:10px 14px;min-height:42px}
  .tabs button[aria-current="page"]{border-left-color:var(--accent);background:var(--accent-soft)}
}
</style>
<script>
/* theme: mode (auto/light/dark) + accent color, saved in this browser */
var THEME_COLORS=[
 {id:"pink",name:"ชมพู"},
 {id:"cherry",name:"แดงเชอร์รี่",l:["#c62828","#fbe3e3","#fff"],d:["#ff8a80","#3b1f1f","#2d0b0b"]},
 {id:"orange",name:"ส้ม",l:["#bf5a0a","#fdebd9","#fff"],d:["#ffa95c","#3a2614","#2b1403"]},
 {id:"green",name:"เขียว",l:["#1f7a4d","#e1f2e9","#fff"],d:["#6fd3a0","#1c3328","#07241a"]},
 {id:"blue",name:"ฟ้า",l:["#1565c0","#e0ecfa","#fff"],d:["#7ab8ff","#172a40","#061a33"]},
 {id:"purple",name:"ม่วง",l:["#6a3fb5","#ece4f7","#fff"],d:["#b69cf0","#2a2040","#170b33"]},
 {id:"choco",name:"ช็อกโกแลต",l:["#7b4a2b","#f1e6dd","#fff"],d:["#d9a47a","#35271d","#26150a"]}
];
var theme={mode:"auto",color:"pink"};
try{var _t=JSON.parse(localStorage.getItem("sr_theme")||"null");if(_t&&_t.mode)theme=_t}catch(e){}
function themeIsDark(){return theme.mode==="dark"||(theme.mode==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)}
function applyTheme(){
  var r=document.documentElement;
  if(theme.mode==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",theme.mode);
  var c=THEME_COLORS.filter(function(x){return x.id===theme.color})[0],v=["--accent","--accent-soft","--accent-fg"];
  if(!c||!c.l){v.forEach(function(k){r.style.removeProperty(k)})}
  else{var a=themeIsDark()?c.d:c.l;v.forEach(function(k,i){r.style.setProperty(k,a[i])})}
}
function saveTheme(){try{localStorage.setItem("sr_theme",JSON.stringify(theme))}catch(e){}}
applyTheme();
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme)}catch(e){}
</script>
</head>
<body>
<div class="wrap">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
var CFG=window.SR_CONFIG||{};
var sb=null;
try{
  if(window.supabase&&CFG.SUPABASE_URL&&CFG.SUPABASE_PUBLISHABLE_KEY){
    sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_PUBLISHABLE_KEY);
  }
}catch(e){sb=null}

var $=function(id){return document.getElementById(id)};
var rows=[];            // branches as the app uses them
var loading=true;       // first load in progress
var loadError="";       // why the list could not be read
var session=true;       // editing is open to everyone (no login)
var busy=false;
var state={q:"",hok:"all",day:"all",sort:"sheet",view:"cards",page:"search",unit:"all",psort:"sheet",plimit:100};
var products=[],ploading=false,ploaded=false,perror="",loginAsk=false;
try{var sv=localStorage.getItem("sr-view");if(sv==="cards"||sv==="table")state.view=sv}catch(e){}

/* ---------- mapping between table columns and app fields ---------- */
function fromRow(r){return{id:r.id,order:r.sort_order||0,th:r.name_th||"",en:r.name_en||"",phone:r.phone||"",code:r.code||"",hours:r.hours||"",zone:r.zone||"",hok:!!r.has_hokkaido,days:r.delivery_days||"",tag21:r.tag_2100||"",tag:r.tag_branch||"",owner:r.owner||"",updatedAt:r.updated_at||""}}
function toRow(o){return{sort_order:o.order,name_th:o.th,name_en:o.en,phone:o.phone,code:o.code,hours:o.hours,zone:o.zone,has_hokkaido:o.hok,delivery_days:o.days||"",tag_2100:o.tag21,tag_branch:o.tag,owner:o.owner}}
function explain(err,tbl){
  tbl=tbl||"branches";
  var c=err&&err.code,m=(err&&err.message)||"";
  if(c==="PGRST205"||c==="42P01")return"ยังไม่มีตาราง "+tbl+" ใน Supabase ให้รันไฟล์ "+(tbl==="products"?"schema_products.sql และ seed_products.sql":tbl==="restaurants"?"schema_restaurants.sql และ seed_restaurants.sql":"schema.sql และ seed.sql")+" ใน SQL Editor ก่อน";
  if(c==="PGRST204"||c==="42703")return"ฐานข้อมูลยังไม่มีคอลัมน์ใหม่ ให้รันไฟล์ "+(tbl==="restaurants"?"schema_restaurants_tag.sql":tbl==="branches"?"schema_delivery.sql":"schema_bellinee.sql และ schema_oem.sql")+" ใน SQL Editor ก่อน";
  if(c==="42501")return"ไม่มีสิทธิ์แก้ไข ให้รันไฟล์ open_edit.sql ใน SQL Editor";
  if(/fetch|network|Failed/i.test(m))return"เชื่อมต่อ Supabase ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่";
  return (m||"เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ")+(c?" ("+c+")":"");
}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s).toLowerCase().replace(/\s+/g," ").trim()}
function hay(b){return norm([b.th,b.en,b.code].join(" "))}
function hl(text,terms){
  var out=esc(text||"");
  terms.forEach(function(t){
    if(!t)return;
    var re=new RegExp("("+esc(t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
    out=out.replace(re,"<mark>$1</mark>");
  });
  return out;
}
function fmtDate(iso){
  if(!iso)return"";
  var d=new Date(iso);if(isNaN(d))return"";
  return d.toLocaleString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
}
var DAYS=[[1,"จันทร์","จ."],[2,"อังคาร","อ."],[3,"พุธ","พ."],[4,"พฤหัสบดี","พฤ."],[5,"ศุกร์","ศ."],[6,"เสาร์","ส."],[7,"อาทิตย์","อา."]];
function daysArr(s){var o=[];String(s||"").split(",").forEach(function(x){var n=parseInt(x,10);if(n>=1&&n<=7&&o.indexOf(n)<0)o.push(n)});return o.sort(function(a,b){return a-b})}
function daysStr(a){return daysArr(a.join(",")).join(",")}
function daysNames(s,short){var a=daysArr(s);return a.length?a.map(function(n){return DAYS[n-1][short?2:1]}).join(" "):"-"}
function dayPills(s){var a=daysArr(s);if(!a.length)return'<span style="color:var(--muted)">-</span>';
  return'<span class="dayline">'+DAYS.map(function(d){return'<span class="dpill'+(a.indexOf(d[0])>-1?" on":"")+'">'+d[2]+'</span>'}).join("")+'</span>'}
function filtered(){
  var terms=norm(state.q).split(" ").filter(Boolean);
  var list=rows.filter(function(b){
    if(state.page==="search"){
      if(state.hok==="yes"&&!b.hok)return false;
      if(state.hok==="no"&&b.hok)return false;
      if(state.day!=="all"&&daysArr(b.days).indexOf(state.day)<0)return false;
    }
    var h=b._h||(b._h=hay(b));
    return terms.every(function(t){return h.indexOf(t)>-1});
  });
  var s=state.page==="search"?state.sort:"sheet";
  if(s==="name")list=list.slice().sort(function(a,b){return a.th.localeCompare(b.th,"th")});
  if(s==="code")list=list.slice().sort(function(a,b){return (parseInt(a.code)||0)-(parseInt(b.code)||0)});
  return {list:list,terms:terms};
}

/* ---------- search page ---------- */
function copyBtn(text,label){
  if(!text)return"";
  return '<button class="copy" type="button" data-copy="'+esc(text)+'" aria-label="คัดลอก'+esc(label)+'">คัดลอก</button>';
}
function allBtn(text){return '<button class="copy copyall" type="button" data-copy="'+esc(text)+'" data-msg="คัดลอกข้อมูลทั้งหมดแล้ว" aria-label="คัดลอกข้อมูลทั้งหมด">คัดลอกทั้งหมด</button>'}
function allText(b){return["ชื่อสาขา: "+b.th,"เบอร์โทร: "+(b.phone||"-"),"เวลาเปิด-ปิด: "+(b.hours||"-"),"โซน: "+(b.zone||"-")].join("\n")}
function rallText(o){return["ชื่อสาขา: "+o.name,"เบอร์โทร: "+(o.phone||"-"),"เวลาเปิด-ปิด: "+(o.hours||"-"),"รายละเอียด: "+(o.details||"-")].join("\n")}
function row(label,html){return"<dt>"+label+"</dt><dd>"+html+"</dd>"}
function val(text,terms,label){
  if(!text)return'<span style="color:var(--muted)">-</span>';
  return '<div class="val"><span>'+hl(text,terms)+'</span>'+copyBtn(text,label)+'</div>';
}
function card(b,t){
  return '<article class="card"><div class="card-head"><div><h2>'+hl(b.th,t)+'</h2><div class="eng">'+hl(b.en,t)+'</div></div>'+
    '<span class="code">#'+hl(b.code,t)+'</span></div>'+
    '<span class="pill '+(b.hok?"yes":"no")+'">'+(b.hok?"มี Hokkaido tart":"ไม่มี Hokkaido tart")+'</span>'+
    '<dl>'+
    row("โทร",'<div class="val"><a class="tel" href="tel:'+esc((b.phone||"").replace(/[^0-9+]/g,""))+'">'+esc(b.phone)+'</a>'+copyBtn(b.phone,"เบอร์โทร")+'</div>')+
    row("เวลา",val(b.hours,[],"เวลาเปิด-ปิด"))+
    row("โซน",val(b.zone,[],"โซน"))+

function isProdName(p){return p==="products"||p==="bellinee"||p==="oem"||p==="sanghiran"}
function isProdPage(){return isProdName(state.page)}
function curCat(){return state.page==="bellinee"?"bellinee":state.page==="oem"?"oem":state.page==="sanghiran"?"sanghiran":"secret"}
function plist(){var c=curCat();return products.filter(function(p){return p.cat===c})}
function pFromRow(r){return{perUnit:r.per_unit||"",cat:r.catalog||"secret",nameTh:r.name_th||"",id:r.id,order:r.sort_order||0,unit:r.unit||"",name:r.name||"",code:r.code||"",price:(r.price===null||r.price===undefined||r.price==="")?null:Number(r.price),updatedAt:r.updated_at||""}}
function pToRow(o){return{per_unit:o.perUnit,catalog:o.cat,name_th:o.nameTh,sort_order:o.order,unit:o.unit,name:o.name,code:o.code,price:o.price}}
function fmtPrice(p){return p===null||p===undefined?"":"฿"+Number(p).toLocaleString("th-TH",{maximumFractionDigits:2})}
function unitLabel(u){return u||"(ไม่ระบุหน่วย)"}
function phay(p){
  if(p._h)return p._h;
  return p._h=norm([p.nameTh,p.name,p.perUnit,p.code,p.code.replace(/[^0-9a-z]/gi,""),p.unit,p.price===null?"":String(p.price)].join(" "));
}
function codeCounts(){var m={};plist().forEach(function(p){if(p.code)m[p.code]=(m[p.code]||0)+1});return m}
function pFiltered(){
  var terms=norm(state.q).split(" ").filter(Boolean);
  var list=plist().filter(function(p){
    if(state.unit!=="all"){
      if(state.unit==="__none"){if(p.unit)return false}else if(p.unit!==state.unit)return false;
    }
    var h=phay(p);
    return terms.every(function(t){return h.indexOf(t)>-1});
  });
  var s=state.psort;
  if(s==="name")list=list.slice().sort(function(a,b){return (a.nameTh||a.name).localeCompare(b.nameTh||b.name,"th")});
  else if(s==="code")list=list.slice().sort(function(a,b){return a.code.localeCompare(b.code)});
  else if(s==="pasc"||s==="pdesc"){
    list=list.slice().sort(function(a,b){
      if(a.price===null&&b.price===null)return 0;if(a.price===null)return 1;if(b.price===null)return -1;
      return s==="pasc"?a.price-b.price:b.price-a.price;
    });
  }
  return{list:list,terms:terms};
}
function fillUnits(){
  var sel=$("punit"),cnt={},order=[],arr=plist();
  arr.forEach(function(p){var k=p.unit||"__none";if(!(k in cnt)){cnt[k]=0;order.push(k)}cnt[k]++});
  order.sort(function(a,b){return cnt[b]-cnt[a]});
  var h='<option value="all">ทุกหน่วย ('+arr.length+')</option>';
  order.forEach(function(k){h+='<option value="'+esc(k)+'">'+esc(k==="__none"?"(ไม่ระบุหน่วย)":k)+' ('+cnt[k]+')</option>'});
  sel.innerHTML=h;
  if(state.unit!=="all"&&!(state.unit in cnt))state.unit="all";
  sel.value=state.unit;
  var dl=$("unitlist");
  dl.innerHTML=order.filter(function(k){return k!=="__none"}).map(function(k){return'<option value="'+esc(k)+'">'}).join("");
}
function pcard(p,t,dups){
  var d=p.code&&dups[p.code]>1;
  var code=p.code?'<span class="code">'+hl(p.code,t)+'</span>'+copyBtn(p.code,"รหัสสินค้า"):'<span class="nocode">ไม่มีรหัส</span>';

    (p.nameTh&&p.name?'<div class="eng">'+hl(p.name,t)+'</div>':'')+
    ((p.unit||p.perUnit||p.cat==="secret"||d)?'<div class="pmeta">'+((p.unit||p.cat==="secret")?'<span class="unit">'+hl(unitLabel(p.unit),t)+'</span>':'')+(p.perUnit?'<span class="per">บรรจุ '+hl(p.perUnit,t)+'</span>':'')+(d?'<span class="dup">รหัสซ้ำ '+dups[p.code]+' รายการ</span>':'')+'</div>':'')+
    '<div class="pbottom"><div class="pcode">'+code+'</div>'+
    '<div class="price'+(p.price===null?" none":"")+'">'+(p.price===null?"ไม่ระบุราคา":hl(fmtPrice(p.price),t))+'</div>'+
    (session?'<button class="btn small" type="button" data-pedit="'+esc(p.id)+'">แก้ไข</button>':'')+
    '</div></article>';

  if(!list.length){out.innerHTML=bar+'<div class="empty"><b>ไม่พบสินค้าที่ตรงกับคำค้น</b>ลองพิมพ์ให้สั้นลง หรือค้นด้วยเลขท้ายของรหัส เช่น 1224</div>'+foot;return}

  out.innerHTML=bar+'<div class="plist">'+shown.map(function(p){return pcard(p,r.terms,dups)}).join("")+'</div>'+more+foot;

async function loadProducts(silent){
  if(!sb){ploading=false;perror="โหลดไลบรารี Supabase ไม่ได้ หรือยังไม่ได้ตั้งค่า config.js";if(isProdPage())render();return}
  if(!silent){ploading=true;perror="";if(isProdPage())render()}
  try{
    var all=[],from=0,step=1000;
    for(;;){
      var r=await sb.from("products").select("*").order("sort_order",{ascending:true}).range(from,from+step-1);
      if(r.error){perror=explain(r.error,"products");all=null;break}
      all=all.concat(r.data||[]);
      if(!r.data||r.data.length<step)break;
      from+=step;
    }
    if(all){products=all.map(pFromRow);perror="";ploaded=true;fillUnits()}
  }catch(e){perror=explain(e,"products")}
  ploading=false;if(isProdPage())render();
}

async function saveP(){

    }

function parseCSV(t){
  var rows=[],row=[],f="",q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===","){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
function parsePrice(s){s=String(s||"").replace(/[,\s฿]/g,"");return /^\d+(\.\d+)?$/.test(s)?Number(s):null}
function sheetRows(cat,csv){
  var rows=parseCSV(csv).filter(function(r){return r.some(function(x){return x.trim()})}),out=[];
  rows.forEach(function(r,i){
    var t=function(k){return(r[k]||"").replace(/\s+/g," ").trim()};
    if(cat==="bellinee"){
      if(i===0&&t(2).toLowerCase()==="code")return;
      out.push({code:t(2),nameTh:t(0),name:t(1),price:parsePrice(r[3])});
    }else if(cat==="sanghiran"){
      if(i===0&&t(0).toLowerCase()==="code")return;
      out.push({code:t(0),name:t(1),perUnit:t(2),price:parsePrice(r[3])});
    }else{
      if(i===0&&t(1).toLowerCase()==="code")return;
      out.push({code:t(1),unit:t(0),name:t(2),perUnit:t(3),price:parsePrice(r[4])});
    }
  });
  return out;
}
var SYNC_FIELDS={bellinee:[["nameTh","ชื่อไทย"],["name","ชื่ออังกฤษ"],["price","ราคา"]],sanghiran:[["name","ชื่อ"],["perUnit","บรรจุ"],["price","ราคา"]],oem:[["unit","ประเภท"],["name","ชื่อ"],["perUnit","บรรจุ"],["price","ราคา"]]};
function buildPlan(cat,srows){
  var cur=plist(),map={},seen={},dupSheet=0,add=[],upd=[],same=0;
  cur.forEach(function(p){if(p.code&&!map[p.code])map[p.code]=p});
  srows.forEach(function(s){
    if(!s.code)return;
    if(seen[s.code]){dupSheet++;return}
    seen[s.code]=1;
    var ex=map[s.code];
    if(!ex){add.push(s);return}
    var ch=[];
    SYNC_FIELDS[cat].forEach(function(f){
      var k=f[0],nv=s[k];
      if(nv===""||nv===null||nv===undefined)return;   // never blank out existing data
      var ov=ex[k];
      if(String(ov===null||ov===undefined?"":ov)!==String(nv))ch.push({k:k,label:f[1],from:ov,to:nv});
    });
    if(ch.length)upd.push({id:ex.id,code:s.code,label:ex.nameTh||ex.name,ch:ch});else same++;
  });
  var missing=cur.filter(function(p){return p.code&&!seen[p.code]});
  return{cat:cat,add:add,upd:upd,same:same,missing:missing,dupSheet:dupSheet,total:srows.length};
}

async function syncApply(){

  var plan=st.plan,cat=plan.cat;
  syncState={cat:cat,busy:true,msg:"กำลังอัปเดตข้อมูล…"};render();
  var failed=0,added=0,updated=0,deleted=0,errMsg="";

    if(plan.add.length){

      }));

  String(s||"").replace(/\./g,"").split(/[,;\/\s]+/).forEach(function(w){
    if(!w)return;var n=0;
    if(/^(จันทร์|จัทนร์|จ)$/.test(w))n=1;
    else if(/^(อังคาร|อ)$/.test(w))n=2;
    else if(/^(พุธ|พุทธ|พ)$/.test(w))n=3;
    else if(/^(พฤหัสบดี|พฤหัส|พฤ)$/.test(w))n=4;
    else if(/^(ศุกร์|ศ)$/.test(w))n=5;
    else if(/^(เสาร์|ส)$/.test(w))n=6;
    else if(/^(อาทิตย์|อา)$/.test(w))n=7;
    else if(/^ทุกวัน$/.test(w)){out=[1,2,3,4,5,6,7];return}
    if(n&&out.indexOf(n)<0)out.push(n);
  });
  return out.sort(function(a,b){return a-b});
}
function bSheetRows(csv){
  var rows=parseCSV(csv).filter(function(r){return r.some(function(x){return x.trim()})}),out=[];
  rows.forEach(function(r){
    var t=function(k){return(r[k]||"").replace(/\s+/g," ").trim()};
    var o={phone:t(0),th:t(1),en:t(2),hours:t(3),zone:t(4),tag:t(6),code:t(7),owner:t(8)};
    var hk=t(5);if(hk==="/")o.hok=true;else if(hk==="-")o.hok=false;
    var dj=parseDaysText(t(9));
    if(dj.length)o.days=dj.join(",");
    else{var flags=[],any=false;   // ชีตเก่า: คอลัมน์ L-Q เป็น 0/1 จันทร์-เสาร์
      for(var i=0;i<7;i++){var v=t(11+i);if(v!=="")any=true;if(v==="1")flags.push(i+1)}
      if(any)o.days=flags.join(",")}
    out.push(o);
  });
  return out;
}
var BSYNC_FIELDS=[["phone","เบอร์โทร"],["th","ชื่อไทย"],["en","ชื่ออังกฤษ"],["hours","เวลา"],["zone","โซน"],["tag","แท็ก"],["hok","Hokkaido"],["days","รอบรถ"],["owner","แอเรีย"]];
function bNormText(v){return String(v==null?"":v).replace(/\s+/g," ").trim()}
function bShow(k,v){if(k==="hok")return v?"มี":"ไม่มี";if(k==="days")return daysNames(v,false);return v===""||v==null?"ว่าง":String(v)}
function bBuildPlan(srows){
  var map={},seen={},add=[],upd=[],same=0,dup=0,nocode=0;
  rows.forEach(function(b){if(b.code&&!map[b.code])map[b.code]=b});
  srows.forEach(function(s){
    if(!s.code){nocode++;return}
    if(seen[s.code]){dup++;return}
    seen[s.code]=1;
    var ex=map[s.code];
    if(!ex){add.push(s);return}
    var ch=[];
    BSYNC_FIELDS.forEach(function(f){
      var k=f[0],nv=s[k];
      if(nv===undefined||nv==="")return;
      var ov=ex[k],differ;
      if(k==="hok")differ=!!ov!==!!nv;
      else if(k==="days")differ=daysStr(daysArr(ov))!==daysStr(daysArr(nv));
      else differ=bNormText(ov)!==bNormText(nv);
      if(differ)ch.push({k:k,label:f[1],from:ov,to:nv});
    });
    if(ch.length)upd.push({id:ex.id,code:s.code,label:ex.th,ch:ch});else same++;
  });
  var missing=rows.filter(function(b){return b.code&&!seen[b.code]});
  return{add:add,upd:upd,same:same,missing:missing,dup:dup,nocode:nocode,total:srows.length};
}

var B_COL={phone:"phone",th:"name_th",en:"name_en",hours:"hours",zone:"zone",tag:"tag_branch",hok:"has_hokkaido",days:"delivery_days",owner:"owner"};
async function bsyncApply(){
  var st=bsync;if(!st||!st.plan||st.busy)return;
  var plan=st.plan;
  bsync={busy:true,msg:"กำลังอัปเดตข้อมูล…"};render();
  var failed=0,added=0,updated=0,deleted=0,errMsg="";
  try{
    if(plan.add.length){
      var order=rows.reduce(function(m,x){return Math.max(m,x.order||0)},0);
      var recs=plan.add.map(function(s,i){
        return{sort_order:order+i+1,name_th:s.th||"",name_en:s.en||"",phone:s.phone||"",code:s.code,hours:s.hours||"",zone:s.zone||"",has_hokkaido:!!s.hok,tag_2100:"",tag_branch:s.tag||"",owner:s.owner||"",delivery_days:s.days||""};
      });
      var ri=await sb.from("branches").insert(recs).select();
      if(ri.error){errMsg=explain(ri.error);failed+=recs.length}else added=(ri.data||[]).length;
    }
    for(var i=0;i<plan.upd.length;i+=10){
      var res=await Promise.all(plan.upd.slice(i,i+10).map(function(u){
        var patch={};u.ch.forEach(function(c){patch[B_COL[c.k]]=c.k==="days"?daysStr(daysArr(c.to)):c.to});
        return sb.from("branches").update(patch).eq("id",u.id).select();
      }));
      res.forEach(function(x){if(x.error){failed++;errMsg=errMsg||explain(x.error)}else if(!x.data||!x.data.length){failed++;errMsg=errMsg||"ไม่มีสิทธิ์แก้ไข (รัน open_edit.sql)"}else updated++});
    }
    for(var j=0;j<plan.missing.length;j+=50){
      var ids=plan.missing.slice(j,j+50).map(function(p){return p.id});
      var rd=await sb.from("branches").delete().in("id",ids).select();
      if(rd.error){failed+=ids.length;errMsg=errMsg||explain(rd.error)}
      else{deleted+=(rd.data||[]).length;if((rd.data||[]).length<ids.length){failed+=ids.length-(rd.data||[]).length;errMsg=errMsg||"ลบบางรายการไม่ได้ (ไม่มีสิทธิ์ลบ — รัน open_edit.sql)"}}
    }
  }catch(e){failed++;errMsg=explain(e)}
  await load(true);
  bsync={done:true,added:added,updated:updated,deleted:deleted,failed:failed,errMsg:errMsg};
  render();
}

var tt;
function toast(msg,ms){
  var el=$("toast");el.textContent=msg;el.hidden=false;
  clearTimeout(tt);tt=setTimeout(function(){el.hidden=true},ms||2200);
}
function fallbackCopy(text){
  var ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");
  ta.style.cssText="position:fixed;opacity:0;top:0;left:0";document.body.appendChild(ta);ta.select();
  var ok=false;try{ok=document.execCommand("copy")}catch(e){}
  document.body.removeChild(ta);return ok;
}
function doCopy(text,msg){
  var done=function(ok){toast(ok?(msg||"คัดลอกแล้ว: "+text):"คัดลอกไม่สำเร็จ ลองกดค้างที่ข้อความ")};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){done(true)},function(){done(fallbackCopy(text))});
  }else done(fallbackCopy(text));
}

  $("themecolors").innerHTML=THEME_COLORS.map(function(c){
    var col=c.l?(dark?c.d[0]:c.l[0]):(dark?"#ee7d9f":"#a4254b");
    return'<button type="button" class="swatch" data-color="'+c.id+'" aria-label="'+c.name+'" aria-pressed="'+(c.id===theme.color?"true":"false")+'" style="background:'+col+'"></button>';
  }).join("");
  var cur=THEME_COLORS.filter(function(c){return c.id===theme.color})[0]||THEME_COLORS[0];
  $("themename").textContent="สีที่ใช้: "+cur.name;
}
function toggleThemePanel(show){
  var p=$("themepanel");if(show===undefined)show=p.hidden;
  p.hidden=!show;$("themebtn").setAttribute("aria-expanded",show?"true":"false");
  if(show)renderThemeUI();
}
$("themebtn").addEventListener("click",function(e){e.stopPropagation();toggleThemePanel()});
$("themepanel").addEventListener("click",function(e){
  e.stopPropagation();
  var m=e.target.closest("[data-mode]"),c=e.target.closest("[data-color]");
  if(m){theme.mode=m.dataset.mode}else if(c){theme.color=c.dataset.color}else return;
  applyTheme();saveTheme();renderThemeUI();
});
document.addEventListener("click",function(){if(!$("themepanel").hidden)toggleThemePanel(false)});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("themepanel").hidden){toggleThemePanel(false);$("themebtn").focus()}});
function pageFromHash(){return location.hash==="#products"?"products":location.hash==="#bellinee"?"bellinee":location.hash==="#oem"?"oem":location.hash==="#sanghiran"?"sanghiran":location.hash==="#restaurants"?"restaurants":"search"}
function setPage(p){
  if(p!==state.page){state.q="";$("q").value=""}
  syncState=null;bsync=null;
  state.page=p;state.plimit=100;state.unit="all";if(ploaded)fillUnits();
  if(!$("sheet").hidden)closeSheet();
  if(!$("psheet").hidden)closeP();
  if(!$("rsheet").hidden)closeR();
  if(isProdName(p)&&!ploaded&&!ploading)loadProducts();
  if(p==="restaurants"){rbrand="all";rarea="all";rsort="sheet";if(!rloaded&&!rloading)loadRest();else fillRFilters()}
  render();window.scrollTo(0,0);
}
function route(){setPage(pageFromHash())}
document.querySelectorAll(".tabs button").forEach(function(b){
  b.addEventListener("click",function(){
    var p=b.dataset.page;
    setPage(p);
    try{if(location.hash!=="#"+p)location.hash="#"+p}catch(e){}
  });
});
window.addEventListener("hashchange",function(){var p=pageFromHash();if(p!==state.page)setPage(p)});
document.addEventListener("visibilitychange",function(){
  if(document.hidden||!sb)return;
  if($("sheet").hidden&&$("psheet").hidden&&$("rsheet").hidden&&!busy&&!pBusy&&!rBusy){load(true);if(ploaded)loadProducts(true);if(rloaded)loadRest(true)}
});

route();
if(sb){
}
load();

</script>
</body>
</html>
